[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
voxbox-dsp = { path = "crates/voxbox-dsp" }
voxbox-rvc = { path = "crates/voxbox-rvc" }
voxbox-myinstants = { path = "crates/voxbox-myinstants" }
voxbox-engine = { path = "crates/voxbox-engine" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
