name: AI voices pack

# Heavy (PyTorch CPU, ~1 GB): rebuilt only when the pack changes or on demand,
# then published as its own release « VoxBox - Voix IA N » (tag ai-pack-N) from main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_ai_pack.ps1
      - scripts/ai_pack_manifest.mjs
      - scripts/minisign.mjs
      - installer/ai-pack.nsi
      - converter/**
      - scripts/publish_release.sh
      # Any workflow change: a pack release skipped because the workflows
      # changed meanwhile is rebuilt by this newer run.
      - .github/workflows/**
  # Pull requests touching the pack build it on Windows (and run its smoke tests, the only
  # place the embedded runtime and the job-object memory ceiling are exercised) without
  # publishing: the publish job below only runs on main.
  pull_request:
    paths:
      - scripts/build_ai_pack.ps1
      - scripts/ai_pack_manifest.mjs
      - scripts/minisign.mjs
      - installer/ai-pack.nsi
      - converter/**
      - .github/workflows/ai-pack.yml

# No concurrency group: each run publishes its own ai-pack-N release, so runs
# never conflict, and a group would let a rerun evict a pending newer build.

permissions:
  contents: read

jobs:
  ai-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build pack content
        shell: pwsh
        run: ./scripts/build_ai_pack.ps1 -OutputDir pack -Version ${{ github.run_number }}
      # windows-latest no longer ships NSIS on PATH: install a pinned version.
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version=3.13.0 --no-progress -y
      - name: Build add-on installer
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & $makensis /DPACK_DIR=$PWD\pack /DOUT_FILE=$PWD\VoxBox-Voix-IA-setup.exe installer\ai-pack.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Published packs only (main): the manifest the app's pack update reads, signed with the
      # updater key and checked against the public key the app ships with.
      - name: Sign the pack manifest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          node scripts/ai_pack_manifest.mjs write VoxBox-Voix-IA-setup.exe ${{ github.run_number }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes @tauri-apps/cli@2 signer sign ai-pack-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ai_pack_manifest.mjs verify ai-pack-manifest.json src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: voxbox-ai-pack
          path: |
            VoxBox-Voix-IA-setup.exe
            ai-pack-manifest.json
            ai-pack-manifest.json.sig
          if-no-files-found: error

  publish:
    name: Publish the « VoxBox - Voix IA » release
    runs-on: ubuntu-latest
    needs: ai-pack
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: voxbox-ai-pack
          path: pack
      # One release per build, never replaced: no window without an installer,
      # and a rerun of an older run cannot overwrite a newer pack.
      - name: Publish ai-pack-${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: >-
          ./scripts/publish_release.sh "ai-pack-${{ github.run_number }}"
          "VoxBox - Voix IA ${{ github.run_number }}"
          "Pack optionnel des voix IA. Installer VoxBox d'abord (dernière release), puis lancer VoxBox-Voix-IA-setup.exe, ou le mettre à jour depuis VoxBox (Réglages → Voix IA)."
          pack/VoxBox-Voix-IA-setup.exe pack/ai-pack-manifest.json pack/ai-pack-manifest.json.sig
