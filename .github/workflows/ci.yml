name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (Tauri, ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libssl-dev pkg-config
      - name: Frontend placeholder for tauri::generate_context!
        run: mkdir -p ui/dist && test -f ui/dist/index.html || echo '<!doctype html>' > ui/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    name: UI (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  windows:
    name: Windows build + installer
    runs-on: windows-latest
    needs: [rust, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm --dir ui install --frozen-lockfile
      - name: Windows unit tests (hotkeys, store, engine, dsp)
        run: cargo test --workspace
      - name: Fetch VB-CABLE pack (AS IS, donationware)
        run: python scripts/fetch_vbcable.py
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build --ci
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: voxbox-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
