name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Publishes a fresh release of main on demand.
  workflow_dispatch:

# Pull requests: a new push cancels the previous run. main: every push keeps
# its own run, so every merge gets its release.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries (Tauri, ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libssl-dev pkg-config
      - name: Frontend placeholder for tauri::generate_context!
        run: mkdir -p ui/dist && test -f ui/dist/index.html || echo '<!doctype html>' > ui/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    name: UI (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Release manifest checks (scripts/updater_manifest.mjs)
        run: node --test ../scripts/updater_manifest.test.mjs
      - name: Pack manifest checks (scripts/ai_pack_manifest.mjs)
        run: node --test ../scripts/ai_pack_manifest.test.mjs
      - name: Release retry checks (scripts/publish_release.sh)
        run: bash ../scripts/publish_release.test.sh

  windows:
    name: Windows build + installer
    runs-on: windows-latest
    needs: [rust, ui]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm --dir ui install --frozen-lockfile
      - name: Windows unit tests (hotkeys, store, engine, dsp)
        run: cargo test --workspace
      - name: Fetch VB-CABLE pack (AS IS, donationware)
        run: python scripts/fetch_vbcable.py
      # Every push to main ships a higher version, so the installer upgrades the
      # installed app, and is signed for the in-app updater. Pull requests keep
      # the version from tauri.conf.json and are not signed.
      - name: Version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0, 2).join('.')")
          if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            version="$base.${{ github.run_number }}"
            signed=true
          else
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            signed=false
          fi
          echo "{\"version\": \"$version\", \"bundle\": {\"createUpdaterArtifacts\": $signed}}" > src-tauri/tauri.version.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build --ci --config tauri.version.json
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.version.outputs.signed == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Verify signature, write latest.json
        if: steps.version.outputs.signed == 'true'
        shell: bash
        run: node scripts/updater_manifest.mjs target/release/bundle/nsis "${{ steps.version.outputs.version }}" "${{ github.repository }}" src-tauri/tauri.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: voxbox-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/latest.json
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: windows
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: voxbox-installer
          path: installer
      - name: Publish v${{ needs.windows.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: ./scripts/publish_release.sh "v$VERSION" "VoxBox $VERSION" generate installer/*-setup.exe installer/latest.json

  # Builds can finish out of order: "latest" always goes to the highest version
  # published so far. Serialized, and recomputed from every release each time,
  # so any interleaving ends on the newest installer.
  latest:
    name: Mark the newest release as latest
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-latest
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tags=$(gh api --paginate "repos/$REPO/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          newest=$({ grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tags" || true; } | sort -V | tail -n1)
          if [ -z "$newest" ]; then
            echo "no app release yet"
            exit 0
          fi
          echo "latest: $newest"
          id=$(gh api "repos/$REPO/releases/tags/$newest" --jq .id)
          gh api -X PATCH "repos/$REPO/releases/$id" -f make_latest=true > /dev/null
