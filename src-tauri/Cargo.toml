[package]
name = "voxbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VoxBox: local voice changer and soundboard for Windows"

[lib]
name = "voxbox_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
voxbox-dsp.workspace = true
voxbox-engine.workspace = true
voxbox-rvc.workspace = true
voxbox-myinstants.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3"
